name: Automated MongoDB Free Tier Backup

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * *'
  # Allows manual 1-click trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  backup:
    name: Backup MongoDB Database ($0 Cost)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Install official mongodump (Takes ~3 seconds)
      - name: Install MongoDB Database Tools
        run: |
          wget -q https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.10.0.deb
          sudo dpkg -i mongodb-database-tools-ubuntu2204-x86_64-100.10.0.deb

      # 2. Dump & Compress Directly from Atlas (Takes ~5 seconds, ZERO project install)
      - name: Run Native mongodump
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          mkdir -p backups
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          mongodump --uri="$MONGODB_URI" --archive="backups/backup_${TIMESTAMP}.gz" --gzip
          ls -lh backups/

      # 3. Verify Backup Integrity & Readability (Zero writes / Dry Run)
      - name: Verify Backup Integrity (Dry Run)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          LATEST_BACKUP=$(ls -t backups/*.gz | head -n 1)
          echo "🔍 [1/2] Verifying archive binary integrity (CRC-32)..."
          gzip -t "$LATEST_BACKUP"
          echo "✓ Archive binary verified: 100% valid."

          echo "🔍 [2/2] Verifying collections and BSON schema via mongorestore dry-run..."
          mongorestore --uri="$MONGODB_URI" --archive="$LATEST_BACKUP" --gzip --dryRun
          echo "✅ Backup archive verified: 100% intact, uncorrupted, and restorable!"

      # 4. Optional: Upload to AWS S3 (Using Ubuntu's pre-installed AWS CLI)
      - name: Mirror to AWS S3 (Optional)
        if: env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.AWS_S3_BUCKET_NAME != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
        run: |
          aws s3 cp backups/ s3://${AWS_S3_BUCKET_NAME}/backups/ --recursive --exclude "*" --include "*.gz"

      # 5. Save to GitHub Artifacts (Free for 90 Days)
      - name: Upload Backup Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup-${{ github.run_number }}
          path: backups/*.gz
          retention-days: 90
