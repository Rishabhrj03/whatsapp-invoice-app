name: Automated MongoDB Free Tier Backup

on:
  schedule:
    # Runs daily at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * *'
  # Allows manual 1-click trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  backup:
    name: Backup MongoDB Database ($0 Cost)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install MongoDB Database Tools (mongodump)
        run: |
          wget -q https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.10.0.deb
          sudo dpkg -i mongodb-database-tools-ubuntu2204-x86_64-100.10.0.deb
          mongodump --version

      - name: Run Database Backup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          BACKUP_RETENTION_DAYS: 30
        run: |
          npm run db:backup

      - name: Upload Backup Artifact to GitHub (Free 90-Day Storage)
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup-${{ github.run_number }}-${{ github.run_id }}
          path: backups/*.gz
          retention-days: 90
